#
# Publishing a version: create a tag "vX.Y.Z" (see docs/GUIA_PARA_MARCOS.md).
# Builds Windows, macOS, Linux and Android, and publishes everything on GitHub
# Releases. Free stage: no paid certificate is needed.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export:web
      - run: node scripts/desktop.mjs prepare
      - name: Package
        shell: bash
        env:
          # Optional (stage 2): macOS signing and notarisation. Without these secrets the DMG is unsigned.
          # (only on the Mac: on Windows electron-builder would try to sign with it)
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
        run: npx electron-builder --config desktop/electron-builder.config.js --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: escritorio-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.appx
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx expo prebuild -p android --clean --no-install
        env:
          ATRIL_OFFLINE_BUILD: '1'
      - name: Release signing key (from GitHub secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
      - name: Build APK and AAB
        env:
          ATRIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATRIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATRIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/AtrilPDF-${GITHUB_REF_NAME}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/AtrilPDF-${GITHUB_REF_NAME}-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  ios:
    # Stage 2: needs an Expo account token and an Apple developer account (99 USD/year).
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_IOS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Lets anyone check that a downloaded file is exactly the published one.
      - name: SHA-256 checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's|  \./[^/]*/|  |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
